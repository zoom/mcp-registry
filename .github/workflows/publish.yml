name: Publish to MCP Registry

# Publishes every zoom-*/server.json whose version is not yet in the registry.
# Auth uses GitHub OIDC, which grants the io.github.zoom/* namespace because
# this repository is owned by the zoom org. No personal token is needed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be published without publishing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "zoom-*/server.json"

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      REGISTRY_URL: https://registry.modelcontextprotocol.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Select entries to publish
        id: select
        run: |
          set -euo pipefail
          : > to_publish.txt
          for f in zoom-*/server.json; do
            dir="$(dirname "$f")"
            name="$(jq -r .name "$f")"
            version="$(jq -r .version "$f")"
            desc_len="$(jq -r '.description | length' "$f")"
            if [ "$desc_len" -gt 100 ]; then
              echo "::error file=$f::description is $desc_len chars (max 100)"
              exit 1
            fi
            encoded="$(printf '%s' "$name" | jq -sRr @uri)"
            code="$(curl -s -o /dev/null -w '%{http_code}' "$REGISTRY_URL/v0.1/servers/$encoded/versions/$version")"
            if [ "$code" = "200" ]; then
              echo "skip    $name@$version (already published)"
            elif [ "$code" = "404" ]; then
              echo "publish $name@$version"
              echo "$dir" >> to_publish.txt
            else
              echo "::error::unexpected HTTP $code checking $name@$version"
              exit 1
            fi
          done
          echo "count=$(wc -l < to_publish.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Authenticate to MCP Registry
        if: steps.select.outputs.count != '0' && inputs.dry_run != true
        run: ./mcp-publisher login github-oidc

      - name: Publish servers
        if: steps.select.outputs.count != '0' && inputs.dry_run != true
        run: |
          failed=0
          while read -r dir; do
            echo "::group::publish $dir"
            if ! (cd "$dir" && "$GITHUB_WORKSPACE/mcp-publisher" publish); then
              echo "::error::publish failed for $dir"
              failed=1
            fi
            echo "::endgroup::"
          done < to_publish.txt
          exit $failed
